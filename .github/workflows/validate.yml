name: Validar frontend MotoPRO
on:
  pull_request:
  push:
    branches: [main]
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
